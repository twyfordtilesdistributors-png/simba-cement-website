name: Update service locations

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update locations
        shell: python
        run: |
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = '<div class="contact-meta-card"><span>LOCATION</span><strong>Merueshi, Kajiado County, Kenya</strong></div>'
          new = '<div class="contact-meta-card"><span>SERVICE LOCATIONS</span><strong>Nairobi · Athi River (Off Lukenya Rd) · Nakuru · Rongai · Salgaa</strong></div>'
          if old not in text:
              raise SystemExit('Expected location block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          workflow = Path('.github/workflows/update-service-locations.yml')
          workflow.unlink()
      - name: Commit update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/update-service-locations.yml
          git commit -m "Update service locations"
          git push