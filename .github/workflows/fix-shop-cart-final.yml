name: Fix Shop cart row placement - final
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Put cart beside product filters
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('shop.html')
          s = p.read_text(encoding='utf-8')
          cart_re = re.compile(r'<button[^>]*id=["\']cartFab["\'][^>]*>.*?</button>', re.S)
          m = cart_re.search(s)
          if not m:
              raise SystemExit('cart button not found')
          cart = m.group(0)
          s = s[:m.start()] + s[m.end():]
          filters = s.find('<div class="shop-filters">')
          if filters < 0:
              raise SystemExit('shop filters not found')
          filters_end = s.find('</div>', filters)
          if filters_end < 0:
              raise SystemExit('shop filters close not found')
          filters_end += len('</div>')
          s = s[:filters_end] + '\n        <div class="shop-cart-inline">' + cart + '</div>' + s[filters_end:]
          marker = '/* SHOP CART ROW FINAL */'
          css = '''
    /* SHOP CART ROW FINAL */
    .shop-tools{display:flex!important;align-items:center!important;justify-content:flex-start!important;gap:12px!important;width:100%!important}
    .shop-filters{display:flex!important;align-items:center!important;gap:8px!important;flex:1 1 auto!important;min-width:0!important;flex-wrap:nowrap!important;overflow-x:auto!important;scrollbar-width:none!important}
    .shop-filters::-webkit-scrollbar{display:none!important}
    .filter-btn{flex:0 0 auto!important;white-space:nowrap!important}
    .shop-count{display:none!important}
    .shop-cart-inline{display:flex!important;align-items:center!important;flex:0 0 auto!important;margin:0!important}
    .shop-cart-inline .cart-fab{position:relative!important;top:auto!important;right:auto!important;bottom:auto!important;left:auto!important;transform:none!important;margin:0!important;z-index:300!important;min-width:64px!important;height:44px!important;padding:0 12px!important}
    .shop-cart-inline .cart-fab:hover{transform:none!important}
    @media(max-width:760px){
      .shop-tools{padding:18px 0 10px!important;gap:8px!important;overflow:hidden!important}
      .shop-filters{overflow-x:auto!important;-webkit-overflow-scrolling:touch!important}
      .shop-cart-inline{flex:0 0 auto!important}
      .shop-cart-inline .cart-fab{min-width:58px!important;height:42px!important;padding:0 10px!important}
    }
'''
          if marker not in s:
              s = s.replace('</style>', css + '</style>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit and push if needed
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add shop.html
          if ! git diff --cached --quiet; then
            git commit -m 'Place Shop cart beside product filters'
            git push
          fi
