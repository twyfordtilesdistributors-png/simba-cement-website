name: Make shop cart buttons direct
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch shop buttons
        shell: python
        run: |
          from pathlib import Path
          p = Path('shop.html')
          s = p.read_text(encoding='utf-8')
          # Give every shop cart button a direct native click handler.
          import re
          pattern = r'<button type="button" class="(shop-add|steel-add)" data-product="([^"]+)" data-price="([^"]+)" data-image="([^"]+)">'
          repl = r'<button type="button" class="\1" onclick="window.addShopProduct(this.dataset.product, this.dataset.price, this.dataset.image)" data-product="\2" data-price="\3" data-image="\4">'
          s = re.sub(pattern, repl, s)
          old = "const addToCart=(product,price,image)=>{const item=cart.find(i=>i.product===product);if(item)item.qty+=1;else cart.push({product,price:Number(price),image,qty:1});saveCart();renderCart();openCart()};"
          new = "window.addShopProduct=(product,price,image)=>{const item=cart.find(i=>i.product===product);if(item)item.qty+=1;else cart.push({product,price:Number(price),image,qty:1});saveCart();renderCart();openCart()};"
          if old in s:
              s = s.replace(old, new)
          # Remove delegated shop handlers so each click is handled exactly once.
          s = re.sub(r'\s*const handleShopCartInput=.*?window\.addEventListener\(\x27click\x27,handleShopCartInput,true\);', '', s, flags=re.S)
          s = s.replace('addToCart(b.dataset.product,b.dataset.price,b.dataset.image)', 'window.addShopProduct(b.dataset.product,b.dataset.price,b.dataset.image)')
          p.write_text(s, encoding='utf-8')
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add shop.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix shop add-to-cart with direct handlers'
          git push
      - name: Remove temporary workflow
        if: always()
        run: |
          git rm -f .github/workflows/shop-cart-inline-fix.yml || true
          git diff --cached --quiet && exit 0
          git commit -m 'Remove temporary shop cart fix workflow'
          git push