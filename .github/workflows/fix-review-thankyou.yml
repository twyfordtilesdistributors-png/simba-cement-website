name: Fix review thank-you message

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Update review thank-you text and remove temporary workflow
        shell: python
        run: |
          from pathlib import Path
          import re

          index = Path("index.html")
          text = index.read_text(encoding="utf-8")

          pattern = r'(<[^>]*id=["\']reviewThanks["\'][^>]*>).*?(</[^>]+>)'
          updated, count = re.subn(
              pattern,
              r'\1Thank you for your feedback.\2',
              text,
              count=1,
              flags=re.S,
          )

          if count != 1:
              raise SystemExit("Could not find the review thank-you message.")

          index.write_text(updated, encoding="utf-8")
          Path(".github/workflows/fix-review-thankyou.yml").unlink()

      - name: Commit and push the change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/fix-review-thankyou.yml
          git diff --cached --quiet || git commit -m "Show only review thank-you message"
          git push
