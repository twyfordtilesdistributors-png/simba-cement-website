name: Move Shop cart inline with filters
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  move-cart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move cart into filter row
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('shop.html')
          s = p.read_text()
          if 'class="shop-cart-inline"' in s and re.search(r'\.shop-cart-inline', s):
              raise SystemExit('cart already patched')
          m = re.search(r'<button[^>]*id="cartFab"[^>]*>.*?</button>', s, re.S)
          if not m:
              raise SystemExit('cart button not found')
          cart = m.group(0)
          s = s[:m.start()] + s[m.end():]
          marker = '<div class="shop-count" id="shopCount">'
          if marker not in s:
              raise SystemExit('shop-count marker not found')
          inline = '<div class="shop-cart-inline">' + cart + '</div>' + marker
          s = s.replace(marker, inline, 1)
          css = '''
    .shop-tools{display:flex;align-items:center;gap:12px;justify-content:flex-start}.shop-cart-inline{display:flex;align-items:center;flex:0 0 auto}.shop-cart-inline .cart-fab{position:static!important;right:auto!important;bottom:auto!important;z-index:200!important;min-width:64px;height:48px;padding:0 15px;margin:0;transform:none!important}.shop-cart-inline .cart-fab:hover{transform:translateY(-1px)!important}
    @media(max-width:760px){.shop-tools{display:flex;align-items:center;gap:8px;overflow-x:auto;flex-wrap:nowrap;padding-bottom:10px}.shop-filters{display:flex;flex-wrap:nowrap;gap:8px;flex:0 0 auto}.shop-cart-inline{flex:0 0 auto}.shop-cart-inline .cart-fab{height:44px;min-width:58px;padding:0 13px}.shop-count{display:none}.filter-btn{white-space:nowrap}}
'''
          s = s.replace('</style>', css + '</style>', 1)
          p.write_text(s)
          PY
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add shop.html
          git diff --cached --quiet || git commit -m 'Place Shop cart inline with product filters'
          git push
      - name: Remove temporary workflow
        if: always()
        run: |
          rm -f .github/workflows/shop-cart-inline.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+users.noreply.github.com'
          git add .github/workflows/shop-cart-inline.yml
          git diff --cached --quiet || git commit -m 'Remove temporary cart inline workflow'
          git push
