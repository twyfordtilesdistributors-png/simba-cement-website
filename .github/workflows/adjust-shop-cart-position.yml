name: Adjust Shop cart position

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  adjust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move cart upward
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('shop.html')
          s = p.read_text()
          old = '.cart-fab{right:14px;bottom:14px}'
          new = '.cart-fab{right:14px;bottom:88px}'
          if old not in s:
              raise SystemExit('Expected mobile cart positioning rule was not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add shop.html
          git commit -m 'Move Shop cart button upward on mobile'
          git push
      - name: Remove temporary workflow
        if: always()
        run: |
          rm -f .github/workflows/adjust-shop-cart-position.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/adjust-shop-cart-position.yml
          git commit -m 'Remove temporary cart position workflow' || true
          git push || true
