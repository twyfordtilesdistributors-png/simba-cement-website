name: Fix shop cart buttons

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Make product cart buttons reliable
        shell: python
        run: |
          from pathlib import Path
          path = Path('shop.html')
          text = path.read_text(encoding='utf-8')

          css_old = '.shop-add{border:0;background:var(--red);color:#fff;padding:11px 14px;border-radius:4px;font-size:11px;font-weight:900;cursor:pointer}'
          css_new = '.shop-add,.steel-add{position:relative;z-index:20;pointer-events:auto;touch-action:manipulation}' + css_old
          if css_old in text and '.shop-add,.steel-add{position:relative' not in text:
              text = text.replace(css_old, css_new, 1)

          old = "document.querySelectorAll('.shop-add,.steel-add').forEach(b=>b.addEventListener('click',()=>addToCart(b.dataset.product,b.dataset.price,b.dataset.image)));"
          new = "document.addEventListener('click',e=>{const b=e.target.closest('.shop-add,.steel-add');if(!b)return;e.preventDefault();addToCart(b.dataset.product,b.dataset.price,b.dataset.image)});"
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              anchor = "    cartBody.addEventListener('click',e=>"
              if anchor in text:
                  text = text.replace(anchor, "    " + new + "\n" + anchor, 1)
              else:
                  raise SystemExit('Could not find cart script insertion point')

          text = text.replace('<button class="shop-add"', '<button type="button" class="shop-add"')
          text = text.replace('<button class="steel-add"', '<button type="button" class="steel-add"')
          path.write_text(text, encoding='utf-8')

          workflow = Path('.github/workflows/fix-shop-cart.yml')
          workflow.unlink()

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shop.html .github/workflows/fix-shop-cart.yml
          git diff --cached --quiet || git commit -m "Fix shop add-to-cart buttons"
          git push
