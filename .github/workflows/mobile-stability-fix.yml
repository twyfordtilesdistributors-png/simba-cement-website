name: Fix mobile viewport stability

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-mobile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Stop mobile swinging and horizontal overflow
        shell: python
        run: |
          from pathlib import Path

          for filename in ('index.html', 'shop.html'):
              path = Path(filename)
              text = path.read_text(encoding='utf-8')

              marker = '</style>'
              if marker not in text:
                  raise SystemExit(f'Missing style block in {filename}')

              fix = '''\n    /* Mobile stability: prevent horizontal page drift and animated modal swinging */\n    html,body{width:100%;max-width:100%;overflow-x:hidden}\n    *,*::before,*::after{box-sizing:border-box}\n    img,video,iframe{max-width:100%}\n    .cart-overlay,.checkout-overlay{overscroll-behavior:contain}\n    .cart-panel{right:0;width:min(470px,100vw);transform:none;transition:none}\n    .cart-overlay.open .cart-panel{transform:none}\n    .checkout-box{width:min(650px,calc(100vw - 24px));transform:translate(-50%,-50%);transition:none}\n    .checkout-overlay.open .checkout-box{transform:translate(-50%,-50%)}\n    @media(max-width:760px){\n      html,body{overflow-x:hidden;touch-action:pan-y}\n      .hero-slide{transition:none}\n      .cart-panel{width:100vw;max-width:100vw}\n      .checkout-box{width:calc(100vw - 20px);max-width:calc(100vw - 20px)}\n    }\n'''
              text = text.replace(marker, fix + marker, 1)
              path.write_text(text, encoding='utf-8')

          workflow = Path('.github/workflows/mobile-stability-fix.yml')
          workflow.unlink()

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html shop.html .github/workflows/mobile-stability-fix.yml
          git diff --cached --quiet || git commit -m "Fix mobile viewport stability and cart motion"
          git push
