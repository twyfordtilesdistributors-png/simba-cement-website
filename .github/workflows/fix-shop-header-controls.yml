name: Fix Shop header controls
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add working menu and back control
        shell: python
        run: |
          from pathlib import Path
          p = Path('shop.html')
          s = p.read_text(encoding='utf-8')

          # Add a back button beside the mobile menu control.
          marker = '<button class="menu-button" id="menuButton"'
          if 'id="shopBackButton"' not in s and marker in s:
              back = '<button class="shop-back-button" id="shopBackButton" type="button" aria-label="Go back">←</button>\n    '
              s = s.replace(marker, back + marker, 1)

          # Give the new control reliable styling without disturbing the existing layout.
          style_marker = '</style>'
          css = '''\n    .shop-back-button{display:none;border:0;background:transparent;color:#171717;width:42px;height:42px;padding:0;margin-right:6px;font-size:25px;line-height:1;cursor:pointer;align-items:center;justify-content:center;position:relative;z-index:300;pointer-events:auto;touch-action:manipulation}\n    @media(max-width:760px){.shop-back-button{display:flex}.site-header .nav-shell{position:relative}.shop-back-button{position:absolute;right:58px;top:50%;transform:translateY(-50%)}}\n    '''
          if '.shop-back-button{' not in s and style_marker in s:
              s = s.replace(style_marker, css + style_marker, 1)

          # Replace/add a deterministic Shop-page header control script before </body>.
          js_marker = '</body>'
          script = '''\n<script>\n(function(){\n  const menuButton=document.getElementById('menuButton');\n  const mainNav=document.getElementById('mainNav');\n  const backButton=document.getElementById('shopBackButton');\n  if(menuButton && mainNav){\n    menuButton.type='button';\n    const setMenu=(open)=>{\n      menuButton.setAttribute('aria-expanded',String(open));\n      mainNav.classList.toggle('open',open);\n      mainNav.classList.toggle('menu-open',open);\n      if(window.innerWidth<=760){\n        mainNav.style.display=open?'flex':'';\n        mainNav.style.pointerEvents=open?'auto':'';\n      }\n    };\n    menuButton.addEventListener('click',(e)=>{e.preventDefault();e.stopPropagation();setMenu(menuButton.getAttribute('aria-expanded')!=='true');});\n    mainNav.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>setMenu(false)));\n    window.addEventListener('resize',()=>{if(window.innerWidth>760){mainNav.style.display='';mainNav.style.pointerEvents='';}});\n  }\n  if(backButton){\n    backButton.addEventListener('click',(e)=>{\n      e.preventDefault();\n      if(window.history.length>1) window.history.back();\n      else window.location.href='index.html#home';\n    });\n  }\n})();\n</script>\n'''
          if 'id="shopBackButton"' in s and 'Go back"' in s:
              if '</script>\n</body>' not in s and '</body>' in s:
                  s = s.replace(js_marker, script + js_marker, 1)

          p.write_text(s, encoding='utf-8')
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add shop.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix Shop menu and add back control'
          git push
      - name: Remove temporary workflow
        if: always()
        run: |
          git rm -f .github/workflows/fix-shop-header-controls.yml || true
          git diff --cached --quiet && exit 0
          git commit -m 'Remove temporary Shop header workflow'
          git push
