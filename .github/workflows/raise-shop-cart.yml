name: Raise Shop cart

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  raise-cart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Raise cart button
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('shop.html')
          s = p.read_text()
          old = '.cart-fab{right:14px;bottom:72px}'
          new = '.cart-fab{right:14px;bottom:150px}'
          if old not in s:
              raise SystemExit('Current mobile cart position rule not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+41898282+github-actions[bot]@users.noreply.github.com' || true
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add shop.html
          git commit -m 'Raise Shop cart button on mobile'
          git push
      - name: Remove temporary workflow
        if: always()
        run: |
          rm -f .github/workflows/raise-shop-cart.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/raise-shop-cart.yml
          git commit -m 'Remove temporary cart raise workflow' || true
          git push || true
