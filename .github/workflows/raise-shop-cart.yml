name: Raise Shop cart button
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/raise-shop-cart.yml'
permissions:
  contents: write
jobs:
  raise-cart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Raise floating cart button
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('shop.html')
          s = p.read_text()
          old = 'bottom:24px;z-index:60'
          new = 'bottom:72px;z-index:60'
          old_mobile = '.cart-fab{right:14px;bottom:14px}'
          new_mobile = '.cart-fab{right:14px;bottom:72px}'
          if old not in s:
              raise SystemExit('desktop cart position target not found')
          if old_mobile not in s:
              raise SystemExit('mobile cart position target not found')
          s = s.replace(old, new, 1).replace(old_mobile, new_mobile, 1)
          p.write_text(s)
          PY
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add shop.html
          git commit -m 'Raise floating Shop cart button'
          git push
      - name: Remove temporary workflow
        if: success()
        run: |
          git rm .github/workflows/raise-shop-cart.yml
          git commit -m 'Remove temporary cart adjustment workflow'
          git push
