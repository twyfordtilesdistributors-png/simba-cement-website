name: Production website polish

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Update production content
        shell: python
        run: |
          from pathlib import Path
          import re

          def write(path, text):
              Path(path).write_text(text.strip() + "\n", encoding="utf-8")

          # Improve image loading without changing the supplied image assets.
          p = Path('index.html')
          t = p.read_text(encoding='utf-8')
          t = t.replace('<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>', '<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n  <link rel="preconnect" href="https://i.postimg.cc">')
          t = t.replace('class="hero-slide" referrerpolicy="no-referrer" src="https://i.postimg.cc/9f623F43/Screenshot-2026-09-01-205703.png" alt="" loading="eager"', 'class="hero-slide" referrerpolicy="no-referrer" src="https://i.postimg.cc/9f623F43/Screenshot-2026-09-01-205703.png" alt="" loading="lazy" decoding="async"')
          t = t.replace('class="hero-slide" referrerpolicy="no-referrer" src="https://i.postimg.cc/vHt5c4bZ/Screenshot-2026-09-01-205810.png" alt="" loading="eager"', 'class="hero-slide" referrerpolicy="no-referrer" src="https://i.postimg.cc/vHt5c4bZ/Screenshot-2026-09-01-205810.png" alt="" loading="lazy" decoding="async"')
          t = re.sub(r'(<img(?![^>]*class="hero-slide")[^>]*)(?<!loading="lazy")(\s*/?>)', r'\1 loading="lazy" decoding="async"\2', t)
          t = t.replace('loading="lazy" decoding="async" loading="lazy" decoding="async"', 'loading="lazy" decoding="async"')
          # Production-grade About section copy, retaining the supplied company history.
          old = '<p>In line with the vision and commitment of Mr Narendra Raval (Guru), we supply building and construction materials at affordable costs to enable local Kenyans to build their homes in a cost effective manner. National Cement Company Limited was the third major diversification and growth initiative of Devki Group. We commenced production and supply of cement in 2010 under the brand name of Simba Cement, all from a single grinding mill with limited capacity at economic cost.</p><p>Sensing the growing demand for Simba Cement, National Cement Company Limited expanded the grinding capacity by 5 times in 2013. With the expansion of grinding capacity, we were able achieve over 20% share of the local market and also begin to export to our neighboring countries in the East Africa region. Likewise, to minimize dependency on international market for supply of core raw material, we effectively use local resources with our clinker manufacturing plant at Merueshi, Kenya to manufacture quality products that Kenyans love today.</p><p>We continually acknowledge the support of our stakeholders for their long-standing loyalty, commitment and trust in our products and the company as a whole. Having said that, National Cement Company Limited truly appreciates the partnership and assistance of the Kenya Commercial Bank and International Finance Corporation (The World Bank Group) for supporting us through our growing journey.</p>'
          new = '<p>Simba Cement is built around dependable construction materials for homes, businesses and infrastructure projects across Kenya. Production and supply under the Simba Cement brand began in 2010, supporting customers with locally available cement for everyday building needs.</p><p>As demand grew, National Cement Company Limited expanded grinding capacity fivefold in 2013. The business also developed local clinker production at Merueshi, Kenya, strengthening the local supply chain and reducing reliance on imported core raw materials.</p><p>Today, our focus is straightforward: dependable products, practical service and a convenient way for customers to place orders and speak directly with our sales team.</p><div class="contact-meta" style="margin-top:18px"><div class="contact-meta-card"><span>LOCATION</span><strong>Merueshi, Kajiado County, Kenya</strong></div><div class="contact-meta-card"><span>CUSTOMER ORDERS</span><strong>0756 311 102 · WhatsApp</strong></div></div>'
          if old in t:
              t = t.replace(old, new, 1)
          t = t.replace('<h2>LATEST FROM SIMBA</h2>', '<h2>COMPANY MILESTONES</h2>')
          t = t.replace('<p>Company milestones, production growth and local manufacturing highlights.</p>', '<p>Key milestones in production, capacity growth and local manufacturing.</p>')
          p.write_text(t, encoding='utf-8')

          # More specific, customer-facing product descriptions on the shop page.
          p = Path('shop.html')
          t = p.read_text(encoding='utf-8')
          replacements = {
              'Reliable cement for everyday construction and general building applications.': 'A dependable 32.5 strength-class cement for general building work, masonry, concrete and everyday construction applications.',
              'High-performance cement for projects where added strength and dependable results matter.': 'A 42.5N cement suited to structural concrete and projects where higher strength performance is required.',
              'Choose bar sizes independently and add multiple sizes to the same order.': 'Reinforcement bars used to strengthen reinforced-concrete work; select the diameter required for your project and combine sizes in one order.',
          }
          for old, new in replacements.items():
              if old in t:
                  t = t.replace(old, new, 1)
          t = t.replace('Practical tying wire for reinforcement and general construction use.', 'Annealed tying wire used to secure reinforcement bars and support practical reinforcement and construction work.')
          t = t.replace('Strong and practical hoop iron for masonry, tying and bracing applications.', 'Hoop iron used in masonry and wall reinforcement work, tying and bracing applications.')
          # Lazy-load all shop catalogue images; keep the logo eager.
          t = re.sub(r'(<img(?![^>]*fetchpriority="high")[^>]*)(?<!loading="lazy")(\s*/?>)', r'\1 loading="lazy" decoding="async"\2', t)
          t = t.replace('loading="lazy" decoding="async" loading="lazy" decoding="async"', 'loading="lazy" decoding="async"')
          legal_links = '<div class="legal-links" style="display:flex;flex-wrap:wrap;gap:14px;margin-top:18px;font-size:10px"><a href="privacy-policy.html">Privacy Policy</a><a href="terms-and-conditions.html">Terms &amp; Conditions</a><a href="delivery-returns.html">Delivery &amp; Returns</a></div>'
          if 'href="privacy-policy.html"' not in t:
              t = t.replace('</footer>', legal_links + '</footer>', 1)
          p.write_text(t, encoding='utf-8')

          # Add the same legal links to the homepage footer.
          p = Path('index.html')
          t = p.read_text(encoding='utf-8')
          if 'href="privacy-policy.html"' not in t:
              t = t.replace('</footer>', legal_links + '</footer>', 1)
          p.write_text(t, encoding='utf-8')

          common_head = '''<!doctype html>
          <html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="index,follow"><title>{title} | Simba Cement</title><meta name="description" content="{description}"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="styles.css"><style>body{{margin:0;background:#f7f7f4;color:#17191c;font-family:Inter,Arial,sans-serif}}.legal-shell{{max-width:900px;margin:0 auto;padding:70px 24px 90px}}.legal-top{{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:35px}}.legal-top img{{width:170px;height:auto;background:#fff}}.legal-back{{font-size:12px;font-weight:800;color:#b51d2a;text-decoration:none}}.legal-card{{background:#fff;border:1px solid #e1e2e2;padding:34px;box-shadow:0 12px 32px rgba(0,0,0,.05)}}h1{{font-family:Oswald,Impact,sans-serif;font-size:clamp(40px,6vw,62px);line-height:.95;margin:0 0 12px}}.updated{{font-size:11px;color:#777;margin-bottom:32px}}h2{{font-size:19px;margin:28px 0 10px}}p,li{{font-size:13px;line-height:1.75;color:#50555a}}ul{{padding-left:20px}}.legal-note{{padding:14px 16px;background:#f7f7f4;border-left:3px solid #b51d2a;margin:24px 0}}</style></head><body><main class="legal-shell"><div class="legal-top"><a href="index.html#home"><img src="https://i.postimg.cc/LsbFMksW/Screenshot-2026-09-01-223430.png" alt="Simba Cement — Strength Within"></a><a class="legal-back" href="index.html#home">BACK TO HOME →</a></div><article class="legal-card"><p style="font-size:10px;font-weight:900;letter-spacing:1.2px;color:#b51d2a;margin:0 0 8px">SIMBA CEMENT</p><h1>{heading}</h1><p class="updated">Last updated: 2 September 2026</p>{body}</article></main></body></html>'''

          privacy_body = '''<p>This Privacy Policy explains how information submitted through the Simba Cement website may be handled when you contact us, request an order, submit customer feedback or otherwise communicate with our sales team.</p><h2>1. Information We May Receive</h2><p>Depending on how you use the website, we may receive your name, telephone number, delivery location, order details, notes or customer feedback. You may choose not to provide optional information such as your name on the feedback form.</p><h2>2. How We Use Information</h2><p>Information is used to respond to enquiries, process and confirm orders, arrange delivery, provide customer service, respond to feedback and communicate about a request you have made.</p><h2>3. WhatsApp Communications</h2><p>Orders and feedback from this website may open WhatsApp using the business number displayed on the website. Information you send through WhatsApp is also subject to WhatsApp's own terms and privacy practices.</p><h2>4. Payments</h2><p>The website does not collect card or mobile-money payment credentials directly. Any payment arrangements are confirmed separately with the sales team.</p><h2>5. Data Sharing</h2><p>We do not publish your personal information on the website. Information may be shared where reasonably necessary to fulfil an order, arrange delivery, comply with a legal requirement or protect the business and its customers.</p><h2>6. Data Retention</h2><p>Information may be retained for as long as reasonably necessary for customer service, order records, accounting, dispute handling or legal obligations.</p><h2>7. Your Choices</h2><p>You may contact us to ask questions about information you have submitted or to request correction of inaccurate details. Some records may need to be retained where required for legitimate business or legal purposes.</p><h2>8. Contact</h2><p>For privacy questions, contact Simba Cement through <a href="https://wa.me/254756311102">WhatsApp on 0756 311 102</a>.</p>'''

          terms_body = '''<p>These Terms &amp; Conditions govern use of this website and the process for requesting products and services from Simba Cement through the website.</p><h2>1. Website Information</h2><p>We aim to keep product information, descriptions and prices useful and current. Product availability, prices and other commercial details may change without notice and should be confirmed with the sales team before an order is finalised.</p><h2>2. Orders</h2><p>Adding products to the website cart creates an order request. An order is not final until the sales team confirms the products, quantities, price, delivery arrangements and any other applicable terms.</p><h2>3. Product Prices</h2><p>Prices displayed on the website are the selling prices configured for this website at the time displayed. Confirm the current price with the sales team before payment or dispatch.</p><h2>4. Customer Details</h2><p>You are responsible for providing accurate contact, delivery and order information. We may contact you to clarify an order before it is accepted.</p><h2>5. Delivery</h2><p>Delivery arrangements depend on order size, destination, product availability and the agreed delivery method. Delivery charges, where applicable, are confirmed before dispatch.</p><h2>6. Product Use</h2><p>Products should be stored, handled and used in accordance with applicable product guidance and competent construction practice. Customers are responsible for selecting materials suitable for their specific project requirements.</p><h2>7. Website Use</h2><p>You must not misuse the website, attempt to interfere with its operation, or submit fraudulent, abusive or unlawful content.</p><h2>8. Governing Law</h2><p>These terms are intended to operate in accordance with the laws of Kenya and any applicable consumer-protection requirements.</p><h2>9. Contact</h2><p>Sales and order enquiries: <a href="https://wa.me/254756311102">0756 311 102 on WhatsApp</a>.</p>'''

          delivery_body = '''<p>This policy explains how orders, delivery and returns are handled when products are requested through the Simba Cement website.</p><h2>1. Order Confirmation</h2><p>Website orders are sent to the sales team through WhatsApp for confirmation. The team will confirm product availability, quantities, current prices and delivery arrangements before the order is treated as accepted.</p><h2>2. Delivery</h2><p>Delivery availability and timing depend on the destination, order size, stock and transport arrangements. Delivery charges, where applicable, are agreed with the customer before dispatch.</p><h2>3. Customer Responsibility</h2><p>Please provide a complete delivery location and reachable telephone number. The customer should ensure that the agreed delivery point is accessible to the delivery vehicle and that someone is available to receive the order.</p><h2>4. Inspection on Delivery</h2><p>Customers should inspect products as soon as practical after delivery and raise visible shortages, damage or incorrect items with the sales team promptly.</p><h2>5. Returns</h2><p>Returns or replacements may be considered for products that are materially defective, damaged before delivery, or supplied incorrectly, subject to inspection and confirmation by the sales team. Products that have been used, altered, stored improperly or damaged after delivery may not qualify for return.</p><h2>6. Incorrect Orders</h2><p>Where an order is changed or cancelled after confirmation, any resulting transport, handling or other costs will be discussed with the customer before the change is processed.</p><h2>7. Cement and Construction Materials</h2><p>Because cement, steel and related materials are project-specific construction inputs, customers should confirm quantities, grades, sizes and intended applications before placing an order.</p><h2>8. Contact for Delivery &amp; Returns</h2><p>Contact the sales team on <a href="https://wa.me/254756311102">WhatsApp on 0756 311 102</a> with your order details and the reason for the request.</p>'''

          write('privacy-policy.html', common_head.format(title='Privacy Policy', description='Privacy Policy for Simba Cement website customers and enquiries.', heading='PRIVACY POLICY', body=privacy_body))
          write('terms-and-conditions.html', common_head.format(title='Terms & Conditions', description='Terms and conditions for using the Simba Cement website and placing order requests.', heading='TERMS & CONDITIONS', body=terms_body))
          write('delivery-returns.html', common_head.format(title='Delivery & Returns', description='Delivery, returns and order handling policy for Simba Cement customers.', heading='DELIVERY & RETURNS', body=delivery_body))

          # Remove any temporary polish workflow files that may still exist.
          wf = Path('.github/workflows/production-polish.yml')
          if wf.exists():
              wf.unlink()
          for name in ['site-polish.yml', 'fix-review-thankyou.yml', 'one-time-review-copy-fix.yml']:
              candidate = Path('.github/workflows') / name
              if candidate.exists():
                  candidate.unlink()

      - name: Commit production update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html shop.html privacy-policy.html terms-and-conditions.html delivery-returns.html .github/workflows
          git diff --cached --quiet || git commit -m "Prepare website for public launch"
          git push
