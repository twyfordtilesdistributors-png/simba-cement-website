name: Fix full shop page interactions
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace shop interaction script
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('shop.html')
          s = p.read_text(encoding='utf-8')

          # Remove inline product handlers so the page has one interaction system.
          s = re.sub(r'\s+onclick="window\.addShopProduct\(this\.dataset\.product, this\.dataset\.price, this\.dataset\.image\)"', '', s)
          s = re.sub(r'<button\s+class="(shop-add|steel-add)"', r'<button type="button" class="\1"', s)

          script = r'''<script>
          (() => {
            const byId = id => document.getElementById(id);
            const money = value => `KSh ${Number(value).toLocaleString('en-KE')}`;
            const cartKey = 'simbaCementCart';
            let cart = [];
            try {
              const saved = JSON.parse(localStorage.getItem(cartKey) || '[]');
              cart = Array.isArray(saved) ? saved.filter(x => x && x.product && Number(x.qty) > 0) : [];
            } catch (_) { cart = []; }

            const menuButton = byId('menuButton');
            const mainNav = byId('mainNav');
            const cartFab = byId('cartFab');
            const cartCount = byId('cartCount');
            const cartOverlay = byId('cartOverlay');
            const closeCart = byId('closeCart');
            const cartBody = byId('cartBody');
            const cartTotal = byId('cartTotal');
            const checkoutButton = byId('checkoutButton');
            const checkoutOverlay = byId('checkoutOverlay');
            const closeCheckout = byId('closeCheckout');
            const checkoutSummary = byId('checkoutSummary');
            const checkoutForm = byId('checkoutForm');

            const saveCart = () => localStorage.setItem(cartKey, JSON.stringify(cart));
            const renderCart = () => {
              const qty = cart.reduce((sum, item) => sum + Number(item.qty || 0), 0);
              const total = cart.reduce((sum, item) => sum + Number(item.price || 0) * Number(item.qty || 0), 0);
              if (cartCount) cartCount.textContent = String(qty);
              if (cartTotal) cartTotal.textContent = money(total);
              if (checkoutButton) checkoutButton.disabled = cart.length === 0;
              if (!cartBody) return;
              if (!cart.length) {
                cartBody.innerHTML = '<div class="cart-empty"><strong>Your cart is empty.</strong><p>Add products to start your order.</p></div>';
                return;
              }
              cartBody.innerHTML = cart.map((item, index) => `
                <div class="cart-item">
                  <img src="${item.image}" alt="" loading="lazy" decoding="async">
                  <div>
                    <h4>${item.product}</h4>
                    <p>${money(item.price)} each</p>
                    <div class="qty-control">
                      <button type="button" data-action="minus" data-index="${index}">−</button>
                      <span>${item.qty}</span>
                      <button type="button" data-action="plus" data-index="${index}">+</button>
                    </div><br>
                    <button class="remove-item" type="button" data-action="remove" data-index="${index}">REMOVE</button>
                  </div>
                  <strong>${money(Number(item.price) * Number(item.qty))}</strong>
                </div>`).join('');
            };

            const openCart = () => {
              renderCart();
              if (cartOverlay) {
                cartOverlay.classList.add('open');
                cartOverlay.setAttribute('aria-hidden', 'false');
              }
            };
            const hideCart = () => {
              if (cartOverlay) {
                cartOverlay.classList.remove('open');
                cartOverlay.setAttribute('aria-hidden', 'true');
              }
            };
            const openCheckout = () => {
              if (!cart.length || !checkoutOverlay || !checkoutSummary) return;
              const total = cart.reduce((sum, item) => sum + Number(item.price) * Number(item.qty), 0);
              checkoutSummary.innerHTML = '<h4>ORDER SUMMARY</h4>' + cart.map(item =>
                `<div><span>${item.product} × ${item.qty}</span><strong>${money(Number(item.price) * Number(item.qty))}</strong></div>`
              ).join('') + `<div style="border-top:1px solid #ddd;margin-top:8px;padding-top:8px;font-weight:900"><span>TOTAL</span><strong>${money(total)}</strong></div>`;
              hideCart();
              checkoutOverlay.classList.add('open');
              checkoutOverlay.setAttribute('aria-hidden', 'false');
              const name = byId('customerName');
              if (name) setTimeout(() => name.focus(), 50);
            };
            const hideCheckout = () => {
              if (checkoutOverlay) {
                checkoutOverlay.classList.remove('open');
                checkoutOverlay.setAttribute('aria-hidden', 'true');
              }
            };

            window.addShopProduct = (product, price, image) => {
              const item = cart.find(x => x.product === product);
              if (item) item.qty = Number(item.qty) + 1;
              else cart.push({ product, price: Number(price), image, qty: 1 });
              saveCart();
              renderCart();
              openCart();
            };

            if (menuButton && mainNav) {
              menuButton.addEventListener('click', event => {
                event.preventDefault();
                event.stopPropagation();
                const open = menuButton.getAttribute('aria-expanded') === 'true';
                menuButton.setAttribute('aria-expanded', String(!open));
                mainNav.classList.toggle('open', !open);
              });
              mainNav.querySelectorAll('a').forEach(link => link.addEventListener('click', () => {
                menuButton.setAttribute('aria-expanded', 'false');
                mainNav.classList.remove('open');
              }));
            }

            document.addEventListener('click', event => {
              const productButton = event.target.closest('.shop-add, .steel-add');
              if (productButton) {
                event.preventDefault();
                event.stopPropagation();
                window.addShopProduct(productButton.dataset.product, productButton.dataset.price, productButton.dataset.image);
                return;
              }

              const filter = event.target.closest('.filter-btn');
              if (filter) {
                document.querySelectorAll('.filter-btn').forEach(x => x.classList.remove('active'));
                filter.classList.add('active');
                const value = filter.dataset.filter;
                let visible = 0;
                document.querySelectorAll('.shop-card').forEach(card => {
                  const show = value === 'all' || card.dataset.category === value;
                  card.classList.toggle('hidden', !show);
                  if (show) visible++;
                });
                const count = byId('shopCount');
                if (count) count.textContent = `${visible} product${visible === 1 ? '' : 's'}`;
              }

              const action = event.target.closest('button[data-action]');
              if (action && cartBody && cartBody.contains(action)) {
                const index = Number(action.dataset.index);
                if (!Number.isInteger(index) || !cart[index]) return;
                if (action.dataset.action === 'plus') cart[index].qty = Number(cart[index].qty) + 1;
                if (action.dataset.action === 'minus') cart[index].qty = Number(cart[index].qty) - 1;
                if (action.dataset.action === 'remove') cart.splice(index, 1);
                cart = cart.filter(x => Number(x.qty) > 0);
                saveCart();
                renderCart();
              }
            }, true);

            if (cartFab) cartFab.addEventListener('click', openCart);
            if (closeCart) closeCart.addEventListener('click', hideCart);
            if (checkoutButton) checkoutButton.addEventListener('click', openCheckout);
            if (closeCheckout) closeCheckout.addEventListener('click', hideCheckout);
            if (cartOverlay) cartOverlay.addEventListener('click', event => { if (event.target === cartOverlay) hideCart(); });
            if (checkoutOverlay) checkoutOverlay.addEventListener('click', event => { if (event.target === checkoutOverlay) hideCheckout(); });

            if (checkoutForm) checkoutForm.addEventListener('submit', event => {
              event.preventDefault();
              if (!cart.length) return;
              const form = new FormData(checkoutForm);
              const total = cart.reduce((sum, item) => sum + Number(item.price) * Number(item.qty), 0);
              const lines = cart.map(item => `- ${encodeURIComponent(item.product)} x${item.qty} = ${encodeURIComponent(money(Number(item.price) * Number(item.qty)))}`).join('%0A');
              const message = `Hello Simba Cement,%0A%0AI would like to place an order.%0A%0ACUSTOMER DETAILS%0AName: ${encodeURIComponent(form.get('name') || '')}%0APhone: ${encodeURIComponent(form.get('phone') || '')}%0ALocation: ${encodeURIComponent(form.get('location') || '')}%0ANotes: ${encodeURIComponent(form.get('notes') || 'None')}%0A%0AORDER%0A${lines}%0A%0ATotal: ${encodeURIComponent(money(total))}`;
              window.open(`https://wa.me/254756311102?text=${message}`, '_blank', 'noopener');
              localStorage.removeItem(cartKey);
              cart = [];
              renderCart();
              hideCheckout();
            });

            renderCart();
          })();
          </script>'''

          s = re.sub(r'<script>.*?</script>', script, s, count=1, flags=re.S)
          p.write_text(s, encoding='utf-8')

      - name: Commit repaired shop page
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add shop.html
          git diff --cached --quiet && exit 0
          git commit -m 'Repair all shop page interactions'
          git push
      - name: Remove one-time workflow
        if: always()
        run: |
          git rm -f .github/workflows/fix-shop-interactions.yml || true
          git diff --cached --quiet && exit 0
          git commit -m 'Remove one-time shop interaction repair workflow'
          git push
