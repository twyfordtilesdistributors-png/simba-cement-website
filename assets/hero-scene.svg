<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" preserveAspectRatio="xMidYMid slice">
<defs>
 <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#d8e8f1"/><stop offset=".62" stop-color="#f6e4c7"/><stop offset="1" stop-color="#cfae81"/></linearGradient>
 <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#8a7159"/><stop offset="1" stop-color="#3c3834"/></linearGradient>
 <linearGradient id="silo" x1="0" x2="1"><stop stop-color="#73797b"/><stop offset=".5" stop-color="#d4d7d5"/><stop offset="1" stop-color="#6c7173"/></linearGradient>
 <linearGradient id="steel" x1="0" x2="1"><stop stop-color="#444b50"/><stop offset=".5" stop-color="#c7ced1"/><stop offset="1" stop-color="#4f565b"/></linearGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
</defs>
<rect width="1600" height="700" fill="url(#sky)"/>
<circle cx="1190" cy="155" r="95" fill="#ffe5a8" opacity=".55" filter="url(#blur)"/>
<!-- distant skyline -->
<g fill="#75828a" opacity=".24">
 <rect x="0" y="460" width="120" height="100"/><rect x="135" y="420" width="75" height="140"/><rect x="225" y="448" width="105" height="112"/><rect x="345" y="395" width="75" height="165"/><rect x="435" y="440" width="130" height="120"/>
</g>
<!-- factory -->
<g transform="translate(920 150)">
 <rect x="0" y="165" width="545" height="260" fill="#777d80" opacity=".96"/>
 <rect x="28" y="190" width="505" height="235" fill="#91979a"/>
 <path d="M0 175H545" stroke="#b9151b" stroke-width="16"/>
