<g transform="translate(1040 495)"><path d="M0 0h115l8 55H-6z" fill="#e0cf9e" stroke="#987d50" stroke-width="3"/><text x="54" y="32" text-anchor="middle" font-family="Arial" font-size="13" font-weight="900" fill="#b9151b">SIMBA</text><text x="54" y="47" text-anchor="middle" font-family="Arial" font-size="12" font-weight="900">CEMENT</text></g>
<g transform="translate(1145 482)"><path d="M0 0h120l8 58H-6z" fill="#e0cf9e" stroke="#987d50" stroke-width="3"/><text x="57" y="34" text-anchor="middle" font-family="Arial" font-size="13" font-weight="900" fill="#b9151b">SIMBA</text><text x="57" y="49" text-anchor="middle" font-family="Arial" font-size="12" font-weight="900">CEMENT</text></g>
