<path d="M0 635H1600" stroke="#f5eddc" stroke-width="7" stroke-dasharray="90 75"/>
<!-- steel foreground -->
<g stroke="url(#steel)" stroke-width="10" opacity=".95"><path d="M640 695L1290 612"/><path d="M715 700L1370 617"/><path d="M790 700L1440 624"/><path d="M865 700L1510 633"/></g>
