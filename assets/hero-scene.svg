 <rect x="344" y="88" width="96" height="337" rx="46" fill="url(#silo)" stroke="#616668" stroke-width="5"/>
 <rect x="468" y="125" width="64" height="300" rx="31" fill="url(#silo)" stroke="#616668" stroke-width="5"/>
 <g stroke="#666d70" stroke-width="5" fill="none"><path d="M82 135h62M82 190h62M82 245h62M82 300h62M226 110h59M226 170h59M226 230h59M226 290h59M365 165h54M365 220h54M365 275h54"/></g>
 <g stroke="#5e666a" stroke-width="8" fill="none"><path d="M16 210h565M16 270h565M16 330h565M16 390h565"/></g>
 <text x="80" y="402" font-family="Arial" font-size="28" font-weight="900" fill="#f3f3f1">SIMBA CEMENT</text>
</g>
<!-- crane -->
<g stroke="#b07a3d" stroke-width="8" fill="none"><path d="M850 90V475"/><path d="M850 90H1220"/><path d="M850 90L765 205"/><path d="M970 90L1080 425"/></g>
<path d="M1090 90v170" stroke="#b07a3d" stroke-width="4"/>
<g fill="#b07a3d"><path d="M1070 255l20 20 20-20-20-20z"/></g>
